<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | XG Football Group</title>
  <link rel="icon" href="images/xg-logo-blue.svg" type="image/svg+xml">

  <style>
    .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .error-page h1 { font-family: var(--font-display); font-size: clamp(4rem, 15vw, 10rem); color: var(--blue-accent); line-height: 1; margin-bottom: 0.5rem; }
    .error-page p { color: var(--white-dim); margin-bottom: 2rem; max-width: 400px; }
    .error-page a { color: var(--blue-accent); font-weight: 600; text-underline-offset: 4px; }
    .error-page a:hover { color: var(--blue-glow); }
  </style>
</head>
<body>
  <main class="error-page">
    <h1>404</h1>
